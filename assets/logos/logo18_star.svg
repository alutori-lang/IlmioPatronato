<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg18" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#0F0420"/>
    </radialGradient>
    <linearGradient id="starGold18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFACD"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="starShine18" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="centerGlow18" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#FFFF00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <filter id="bigGlow18" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starShadow18" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.8"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg18)"/>
  <circle cx="512" cy="512" r="450" fill="url(#centerGlow18)"/>
  <g stroke="#FFD700" stroke-width="3" opacity="0.6" stroke-linecap="round">
    <line x1="512" y1="100" x2="512" y2="60"/>
    <line x1="512" y1="924" x2="512" y2="964"/>
    <line x1="100" y1="512" x2="60" y2="512"/>
    <line x1="924" y1="512" x2="964" y2="512"/>
    <line x1="220" y1="220" x2="180" y2="180"/>
    <line x1="804" y1="220" x2="844" y2="180"/>
    <line x1="220" y1="804" x2="180" y2="844"/>
    <line x1="804" y1="804" x2="844" y2="844"/>
  </g>
  <g>
    <circle cx="180" cy="350" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="844" cy="380" r="8" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="200" cy="700" r="5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="824" cy="680" r="7" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="350" cy="180" r="4" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="680" cy="850" r="5" fill="#FFFFFF" opacity="0.8"/>
  </g>
  <g filter="url(#bigGlow18)">
    <g filter="url(#starShadow18)" transform="translate(512 540)">
      <path d="M 0 -340
               L 80 -100
               L 320 -100
               L 130 50
               L 200 280
               L 0 140
               L -200 280
               L -130 50
               L -320 -100
               L -80 -100 Z"
            fill="url(#starGold18)" stroke="#5D3A00" stroke-width="6"/>
      <path d="M 0 -340
               L 80 -100
               L 320 -100
               L 130 50
               L 200 280
               L 0 140
               L -200 280
               L -130 50
               L -320 -100
               L -80 -100 Z"
            fill="url(#starShine18)"/>
    </g>
  </g>
  <g transform="translate(512 540)" filter="url(#starShadow18)">
    <text x="0" y="0" text-anchor="middle"
          font-family="Arial Black, sans-serif"
          font-size="220" font-weight="900" fill="#5D3A00"
          stroke="#FFFFFF" stroke-width="6"
          dominant-baseline="middle">€</text>
  </g>
  <g transform="translate(512 880)">
    <rect x="-90" y="0" width="60" height="22" fill="#009246" rx="4"/>
    <rect x="-30" y="0" width="60" height="22" fill="#FFFFFF" rx="4"/>
    <rect x="30" y="0" width="60" height="22" fill="#CE2B37" rx="4"/>
  </g>
</svg>
