<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <linearGradient id="paper3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
    <linearGradient id="paperBack3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <linearGradient id="check3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="green3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#009246"/>
      <stop offset="100%" stop-color="#006B33"/>
    </linearGradient>
    <linearGradient id="red3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CE2B37"/>
      <stop offset="100%" stop-color="#9B1F28"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="6" dy="14" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="checkShadow3">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg3)"/>
  <g filter="url(#shadow3)" transform="rotate(-8 512 512)">
    <rect x="280" y="240" width="420" height="540" rx="20" fill="url(#paperBack3)"/>
  </g>
  <g filter="url(#shadow3)">
    <rect x="320" y="220" width="420" height="540" rx="20" fill="url(#paper3)"/>
    <rect x="320" y="220" width="420" height="60" rx="20" fill="url(#green3)"/>
    <rect x="320" y="240" width="140" height="40" fill="url(#green3)"/>
    <rect x="460" y="240" width="140" height="40" fill="#FFFFFF"/>
    <rect x="600" y="240" width="140" height="40" fill="url(#red3)"/>
    <rect x="360" y="340" width="280" height="14" rx="7" fill="#9CA3AF" opacity="0.5"/>
    <rect x="360" y="380" width="340" height="14" rx="7" fill="#9CA3AF" opacity="0.5"/>
    <rect x="360" y="420" width="220" height="14" rx="7" fill="#9CA3AF" opacity="0.5"/>
    <rect x="360" y="460" width="300" height="14" rx="7" fill="#9CA3AF" opacity="0.3"/>
    <rect x="360" y="500" width="180" height="14" rx="7" fill="#9CA3AF" opacity="0.3"/>
  </g>
  <g filter="url(#checkShadow3)" transform="translate(620 580)">
    <circle r="160" fill="url(#check3)"/>
    <circle r="160" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.3"/>
    <path d="M -70 0 L -20 60 L 80 -60" stroke="#FFFFFF" stroke-width="32"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
