<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0F0F1F"/>
    </linearGradient>
    <linearGradient id="diamondTop16" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="diamondLeft16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="diamondRight16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="diamondBottom16" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <radialGradient id="bigShine16" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="diamondShadow16" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="20" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg16)"/>
  <circle cx="512" cy="500" r="380" fill="url(#bigShine16)"/>
  <g transform="translate(0 30)">
    <line x1="220" y1="180" x2="180" y2="140" stroke="#FFFFFF" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
    <line x1="804" y1="180" x2="844" y2="140" stroke="#FFFFFF" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
    <line x1="160" y1="500" x2="100" y2="500" stroke="#FFFFFF" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
    <line x1="864" y1="500" x2="924" y2="500" stroke="#FFFFFF" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
    <circle cx="160" cy="220" r="6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="860" cy="280" r="8" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="200" cy="800" r="5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="824" cy="780" r="7" fill="#FFFFFF" opacity="0.7"/>
  </g>
  <g filter="url(#diamondShadow16)" transform="translate(512 540)">
    <polygon points="-300,-60 -180,-260 180,-260 300,-60 0,320"
             fill="url(#diamondTop16)" stroke="#FFFFFF" stroke-width="6"/>
    <polygon points="-300,-60 -180,-260 0,-60 0,320"
             fill="url(#diamondLeft16)" opacity="0.85"/>
    <polygon points="0,-60 180,-260 300,-60 0,320"
             fill="url(#diamondRight16)" opacity="0.85"/>
    <polygon points="-300,-60 0,-60 -150,-160" fill="#FFFFFF" opacity="0.4"/>
    <polygon points="0,-60 300,-60 150,-160" fill="#FFFFFF" opacity="0.3"/>
    <line x1="-180" y1="-260" x2="0" y2="320" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
    <line x1="180" y1="-260" x2="0" y2="320" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
    <line x1="-300" y1="-60" x2="300" y2="-60" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
  </g>
  <g transform="translate(512 470)">
    <text x="0" y="0" text-anchor="middle"
          font-family="Arial Black, sans-serif"
          font-size="170" font-weight="900" fill="#FFFFFF"
          stroke="#000000" stroke-width="3" opacity="0.95"
          dominant-baseline="middle">€</text>
  </g>
  <g transform="translate(512 880)">
    <rect x="-90" y="0" width="60" height="22" fill="#009246" rx="4"/>
    <rect x="-30" y="0" width="60" height="22" fill="#FFFFFF" rx="4"/>
    <rect x="30" y="0" width="60" height="22" fill="#CE2B37" rx="4"/>
  </g>
</svg>
