<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="green1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#009246"/>
      <stop offset="100%" stop-color="#006B33"/>
    </linearGradient>
    <linearGradient id="red1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CE2B37"/>
      <stop offset="100%" stop-color="#9B1F28"/>
    </linearGradient>
    <linearGradient id="white1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gloss1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg1)"/>
  <g filter="url(#shadow1)">
    <path d="M 512 180
             L 780 280
             L 780 520
             Q 780 720 512 860
             Q 244 720 244 520
             L 244 280 Z" fill="url(#bg1)" stroke="#FFD700" stroke-width="6"/>
    <path d="M 512 180
             L 780 280
             L 780 520
             Q 780 720 512 860
             Q 244 720 244 520
             L 244 280 Z" fill="url(#gloss1)"/>
    <clipPath id="shieldClip1">
      <path d="M 512 180
               L 780 280
               L 780 520
               Q 780 720 512 860
               Q 244 720 244 520
               L 244 280 Z"/>
    </clipPath>
    <g clip-path="url(#shieldClip1)">
      <rect x="244" y="180" width="178" height="700" fill="url(#green1)"/>
      <rect x="422" y="180" width="180" height="700" fill="url(#white1)"/>
      <rect x="602" y="180" width="178" height="700" fill="url(#red1)"/>
    </g>
  </g>
  <g transform="translate(512 540)" filter="url(#shadow1)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial Black, sans-serif"
          font-size="380" font-weight="900" fill="url(#gold1)"
          stroke="#8B4513" stroke-width="6"
          dominant-baseline="middle">€</text>
  </g>
</svg>
