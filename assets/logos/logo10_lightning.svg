<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg10" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="50%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </radialGradient>
    <linearGradient id="bolt10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFFF00"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>
    <linearGradient id="boltShine10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="electricGlow10" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFF00" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFD600" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD600" stop-opacity="0"/>
    </radialGradient>
    <filter id="bigGlow10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="boltShadow10" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="6" dy="14" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg10)"/>
  <circle cx="512" cy="512" r="450" fill="url(#electricGlow10)"/>
  <g transform="translate(0 -20)" filter="url(#bigGlow10)">
    <g filter="url(#boltShadow10)">
      <path d="M 600 130
               L 320 540
               L 470 540
               L 380 880
               L 720 460
               L 560 460
               L 660 130 Z"
            fill="url(#bolt10)" stroke="#FF6F00" stroke-width="8"
            stroke-linejoin="round"/>
      <path d="M 600 130
               L 320 540
               L 470 540
               L 380 880
               L 720 460
               L 560 460
               L 660 130 Z"
            fill="url(#boltShine10)"/>
    </g>
  </g>
  <g transform="translate(620 540)" filter="url(#boltShadow10)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial Black, sans-serif"
          font-size="220" font-weight="900" fill="#1A1A1A"
          stroke="#FFFFFF" stroke-width="6"
          dominant-baseline="middle">€</text>
  </g>
  <g transform="translate(150 880)">
    <rect x="0" y="0" width="55" height="40" fill="#009246" rx="6"/>
    <rect x="55" y="0" width="55" height="40" fill="#FFFFFF" rx="6"/>
    <rect x="110" y="0" width="55" height="40" fill="#CE2B37" rx="6"/>
  </g>
</svg>
