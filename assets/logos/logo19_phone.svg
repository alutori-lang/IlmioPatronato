      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="phoneShadow19" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="24" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg19)"/>
  <circle cx="512" cy="500" r="380" fill="url(#bigGlow19)"/>
  <g filter="url(#phoneShadow19)">
    <rect x="320" y="160" width="384" height="704" rx="60" fill="url(#phoneBody19)"/>
    <rect x="340" y="180" width="344" height="664" rx="40" fill="url(#phoneScreen19)"/>
    <rect x="340" y="180" width="344" height="664" rx="40" fill="url(#phoneShine19)"/>
    <rect x="460" y="200" width="104" height="20" rx="10" fill="#000000"/>
  </g>
  <g filter="url(#phoneShadow19)" transform="translate(360 280)">
    <rect x="0" y="0" width="304" height="180" rx="20" fill="url(#notifGreen19)"
