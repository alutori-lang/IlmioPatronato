          dominant-baseline="middle">€</text>
    <text x="80" y="50" font-family="Arial, sans-serif"
          font-size="22" font-weight="700" fill="#15803D">BONUS</text>
    <rect x="20" y="80" width="270" height="10" rx="5" fill="#FFFFFF" opacity="0.7"/>
    <rect x="20" y="100" width="220" height="10" rx="5" fill="#FFFFFF" opacity="0.5"/>
    <rect x="20" y="120" width="180" height="10" rx="5" fill="#FFFFFF" opacity="0.4"/>
  </g>
  <g filter="url(#phoneShadow19)" transform="translate(360 480)">
    <rect x="0" y="0" width="304" height="160" rx="20" fill="#FFFFFF"
          stroke="#9CA3AF" stroke-width="3"/>
    <rect x="20" y="20" width="100" height="14" rx="3" fill="#009246"/>
    <rect x="20" y="44" width="80" height="14" rx="3" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
    <rect x="20" y="68" width="100" height="14" rx="3" fill="#CE2B37"/>
    <rect x="20" y="98" width="270" height="10" rx="5" fill="#9CA3AF" opacity="0.5"/>
    <rect x="20" y="118" width="200" height="10" rx="5" fill="#9CA3AF" opacity="0.4"/>
    <text x="270" y="40" text-anchor="middle" font-family="Arial Black, sans-serif"
